[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tricolumn-video"
version = "0.1.0"
description = "Local three-column video composition with filtering, balanced scheduling, resume and verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tricolumn = "tricolumn.__main__:main"

[tool.setuptools.packages.find]
include = ["tricolumn*"]
